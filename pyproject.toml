[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matr-clean"
version = "0.3.0"
description = "Import the cleaned MIT-Stanford-TRI battery analysis set with pandas and numpy only"
readme = "USAGE.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Tayeb Elleuch" }]
keywords = ["battery", "lithium-ion", "state-of-health", "dataset", "severson", "matr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

# Deliberately unpinned at both ends: teammates install this next to whatever
# pandas their project already uses. Tested against pandas 2.x and 3.x.
dependencies = ["pandas", "numpy"]

[project.optional-dependencies]
test = ["pytest"]
# load_series / load_vdlin / open_batch read the three HDF5 files of the v1.1
# extraction. The declared floor is 3.0, because the files use nothing newer than
# gzip + shuffle on plain contiguous and chunked datasets, all of which h5py 3.0
# had. The oldest version actually *tested* is 3.12.1: on Python 3.13 no cp313
# wheel exists for h5py 3.0.0-3.11.0 and they do not build from source, so 3.12.1
# is the oldest that can be run here. It reads all three published files correctly
# under HDF5 1.14.4 against files written by HDF5 2.0.0. The floor is kept at 3.0
# rather than raised to 3.12.1 so a working Python 3.9/3.10 environment -- the
# reason the 3.9 floor exists -- is not excluded.
# Nothing outside matr_clean/_h5.py imports h5py, and that import is inside a
# function, so installing without this extra keeps every v0.2.x entry point working.
series = ["h5py>=3.0"]
# For running the exploration/ scripts and the standalone checks in that folder.
# matplotlib is needed only there: exploration/test_cell_addressing.py imports
# SAMPLE from plots_7_10.py, which imports pyplot. matr_clean itself never does.
dev = ["matplotlib", "pytest"]

[project.urls]
Homepage = "https://github.com/tayebelleuch-ops/deep-analysis-of-MIT-TOYOTA-dataset"
Report = "https://github.com/tayebelleuch-ops/deep-analysis-of-MIT-TOYOTA-dataset/blob/main/exploration/REPORT.md"
Usage = "https://github.com/tayebelleuch-ops/deep-analysis-of-MIT-TOYOTA-dataset/blob/main/USAGE.md"

[tool.setuptools]
# Only the package. The three CSVs are NOT packaged: they are read from the lookup
# order in matr_clean/_locate.py, and exploration/ is never copied or modified.
packages = ["matr_clean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in only: the suite is offline by default (tests/conftest.py replaces urlopen
# with one that raises). A marked test is skipped unless MATR_CLEAN_TEST_NETWORK=1.
markers = [
    "network: fetches from the published Zenodo record; needs MATR_CLEAN_TEST_NETWORK=1",
]
